[dependencies]

[dev-dependencies]
# Property-based testing for the stateful primitives (PenaltyBox,
# CountMinSketch, FlowTable, AhoCorasick). Dev-only — never linked into
# the kernel. `default-features = false` strips the std fork machinery
# and the regex shrinker; we don't need them for byte-slice strategies.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
