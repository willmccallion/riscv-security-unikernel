[package]
name = "security-unikernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bare-metal RISC-V security unikernel — 64 KB RAM, VirtIO-Net, no_std/no_main."

[dependencies]
sec-core = { workspace = true }

[features]
# Enable the Zkr (RISC-V K extension) entropy source. Reads CSR `seed`
# (0x015), which traps to the illegal-instruction handler on CPUs that
# do not implement Zkr. The kernel currently has no trap handler, so
# enabling this on a CPU without Zkr means a boot-time crash. Leave
# off for QEMU `virt` (which traps Zkr) and turn on for SiFive U7/P
# series, T-Head C9xx with the K option, etc.
zkr = []

[lints]
workspace = true
