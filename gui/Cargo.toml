[lints]
workspace = true

[lints.clippy]
# Pedantic baseline — keeps the control plane code clean and idiomatic.
pedantic = { level = "warn", priority = -1 }

# egui widget methods are naturally named after the module they live in.
module_name_repetitions = "allow"
# Most GUI callbacks and eframe trait methods don't benefit from must_use.
must_use_candidate = "allow"
# eframe/egui return types make this noisy without adding safety value.
missing_errors_doc = "allow"
# Tokio async blocks have legitimate complex cognition; don't split them artificially.
cognitive_complexity = "allow"

[package]
name = "security-dashboard"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = "0.26"
egui = "0.26"
egui_plot = "0.26"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
rand = "0.8"
crossbeam-channel = "0.5" # For communicating between Async Net and GUI
