[lints]
workspace = true

[lints.rust]
# All public items must carry doc comments.
missing_docs = "warn"
# Types without Debug are harder to inspect; derive it unless repr/packed prevents it.
missing_debug_implementations = "warn"

[lints.clippy]
# Full pedantic + nursery treatment: the kernel must be idiomatically correct Rust.
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

# ── Hard denies ────────────────────────────────────────────────────────────────

# Upgrades the workspace warn: every unsafe block in the kernel must be justified.
undocumented_unsafe_blocks = "deny"
# Every public unsafe fn must have a `# Safety` section in its doc comment.
missing_safety_doc = "deny"
# No unwrap/expect — a panic in bare-metal is a hard fault with no recovery.
unwrap_used   = "deny"
expect_used   = "deny"
# No placeholders — kernel code ships, it doesn't have stubs.
todo          = "deny"
unimplemented = "deny"

# ── Warns (not denies) ─────────────────────────────────────────────────────────

# One deliberate boot-failure panic exists (missing hardware); warn so any new
# ones are visible and consciously chosen.
panic = "warn"

# ── Targeted allows ────────────────────────────────────────────────────────────

# Protocol parsing and MMIO register writes are inherently cast-heavy: network
# byte-order assembly (u8→u64), hardware PFN calculation (usize→u32), packet
# field narrowing (u16→u8). All sites are correct by construction. Per-line
# attributes across every packet-building function would obscure the logic.
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"
cast_lossless            = "allow"
cast_precision_loss      = "allow"

# The main packet-processing loop is a single tightly-coupled decision tree.
# Splitting it would fragment protocol logic across artificial boundaries.
too_many_lines = "allow"

# Scoped consts defined next to their only use site (e.g. BATCH_SIZE, offsets
# inside send_udp_report) are clearer than hoisting to module scope where they
# have no context. Pedantic's items_after_statements fires on these.
items_after_statements = "allow"

# Network field names (src_ip/dst_ip, src_port/dst_port) mirror the protocol
# spec. Renaming them would reduce clarity, not improve it.
similar_names = "allow"

# if-let chains in packet parsing express early-exit control flow naturally.
# option_if_let_else would rewrite them as map/unwrap_or chains that obscure
# the bail-out intent.
option_if_let_else = "allow"

# Paths like security::firewall::FirewallState repeat the parent module name
# by design — this is standard Rust module organisation.
module_name_repetitions = "allow"

[package]
name = "security-unikernel"
version = "1.0.0"
edition = "2024"

[dependencies]

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Link Time Optimization
codegen-units = 1     # Maximize optimization context
panic = "abort"       # Remove unwinding symbols
strip = true          # Strip symbols from binary
debug = false
