[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/kernel",
    "crates/daemon",
    "crates/gui",
    "crates/benches",
    "crates/qemu-harness",
    "crates/sketch-lab",
]
# cargo-fuzz packages need nightly + libFuzzer instrumentation. Keep them
# out of the default `cargo build` so contributors aren't forced onto
# nightly to compile the kernel. Run via `make fuzz-*` instead.
exclude = ["crates/core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Will McCallion"]
license = "MIT OR Apache-2.0"
keywords = ["security", "networking", "unikernel", "riscv", "no-std"]
categories = ["network-programming", "no-std::no-alloc"]

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
incremental   = false

# The unikernel needs `opt-level = "z"` to stay inside the 64 KB RAM budget.
# Override just that one package; the daemon + GUI + benches stay at opt-level 3.
[profile.release.package.security-unikernel]
opt-level = "z"

# Optimise dependencies in dev — compression/crypto libs don't need debug codegen.
[profile.dev.package."*"]
opt-level = 3

# The dashboard also drives a real-time egui render loop and a 300 pps
# traffic generator; opt-level 0 on its own code stutters the UI in
# debug builds. With the dev-only mgmt-key fallback now *only* firing
# in debug builds, we lean on debug builds for local dev and need
# them to actually be usable.
[profile.dev.package.security-dashboard]
opt-level = 1

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_results = "warn"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
inline_always = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
match_same_arms = "allow"

[workspace.lints.rustdoc]
all = "deny"
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"

[workspace.dependencies]
sec-core = { path = "crates/core", version = "0.1.0", default-features = false }

anyhow             = "1.0"
tracing            = "0.1"
tracing-subscriber = "0.3"
serde              = { version = "1.0", features = ["derive"] }
bincode            = "1.3"
serde_json         = "1.0"
toml               = "0.8"
clap               = { version = "4.4", features = ["derive"] }
rand               = "0.8"
